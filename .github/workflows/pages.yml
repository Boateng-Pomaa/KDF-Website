# Client preview: builds the static `pages` configuration (noindex, base href
# /KDF-Website/) and publishes it to GitHub Pages on every push to the working
# branch. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [feat/public-site-and-firebase-scaffold]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx ng build --configuration production,pages

      # GitHub Pages serves 404.html (with HTTP 404) for unknown paths; the
      # client-rendered shell boots the app, whose `**` route shows NotFound.
      - run: cp dist/KDF-Website/browser/index.csr.html dist/KDF-Website/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/KDF-Website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
